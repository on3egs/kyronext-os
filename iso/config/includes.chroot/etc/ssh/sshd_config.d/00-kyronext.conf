# Image Live : authentification par clé, jamais le mot de passe Live partagé.
PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes
AllowUsers kyronext
AuthorizedKeysFile .ssh/authorized_keys /etc/kyronext/ssh/authorized_keys
HostKey /run/kyronext-ssh/ssh_host_ed25519_key
